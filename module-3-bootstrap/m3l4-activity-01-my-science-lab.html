<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Science Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">

        <!-- Jumbotron-style banner (Bootstrap 5 uses utility classes instead of the old .jumbotron class) -->
        <div class="p-5 mb-4 bg-light rounded-3 text-center">
            <h1>My Science Lab</h1>
            <p class="lead">Tracking experiments and research progress across four subjects.</p>
        </div>

        <!-- Four coloured buttons -->
        <div class="mb-4">
            <button class="btn btn-primary me-2">Chemistry</button>
            <button class="btn btn-success me-2">Biology</button>
            <button class="btn btn-danger me-2">Physics</button>
            <button class="btn btn-dark">Astronomy</button>
        </div>

        <!-- Each subject with a badge and a progress bar -->
        <div class="mb-3">
            <h5>Chemistry <span class="badge bg-primary">12 experiments</span></h5>
            <div class="progress">
                <div class="progress-bar bg-primary" role="progressbar" style="width: 70%">70%</div>
            </div>
        </div>

        <div class="mb-3">
            <h5>Biology <span class="badge bg-success">8 experiments</span></h5>
            <div class="progress">
                <div class="progress-bar bg-success" role="progressbar" style="width: 55%">55%</div>
            </div>
        </div>

        <div class="mb-3">
            <h5>Physics <span class="badge bg-danger">15 experiments</span></h5>
            <div class="progress">
                <div class="progress-bar bg-danger" role="progressbar" style="width: 85%">85%</div>
            </div>
        </div>

        <div class="mb-3">
            <h5>Astronomy <span class="badge bg-dark">5 experiments</span></h5>
            <div class="progress">
                <div class="progress-bar bg-dark" role="progressbar" style="width: 30%">30%</div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
