<!DOCTYPE html>
<html lang="en">

<body>

    <h2>Operator</h2>

    <p id="demo"></p>

    <script>
        // Addition
        // JavaScript supports operators like: +, -, *, /

        let x = 5;
        let y = 2;
        let z = x + y;

        document.getElementById("demo").innerHTML = z;
    </script>

</body>

</html>
