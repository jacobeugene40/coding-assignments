<!DOCTYPE html>
<html lang="en">

<body>

    <h2>JavaScript Statements</h2>
    <p>A <b>JavaScript program</b> is a list of instructions to be executed by the browser. Each instruction is called a
        <b>statement</b>.</p>

    <p id="demo"></p>

    <script>
        let x, y, z;   // Statement 1: declare three variables
        x = 5;         // Statement 2: assign value to x
        y = 6;         // Statement 3: assign value to y
        z = x + y;     // Statement 4: add x and y, store result in z

        document.getElementById("demo").innerHTML = "The value of z is " + z + ".";
    </script>

</body>

</html>
