<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

  <!-- My CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
    rel="stylesheet" />

  <title>My Portfolio</title>
</head>

<body>

  <div id="projects" class="container py-5 text-center text-white">
    <h1 class="mb-5">My Projects</h1>

    <div class="row">

      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="weather.png" class="card-img-top" alt="Project 1" />
          <div class="card-body">
            <h5 class="card-title">Weather App</h5>
            <p class="card-text">A simple app that shows live weather conditions using HTML, CSS, and JavaScript.</p>
            <button class="btn btn-warning">View Project</button>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="game.png" class="card-img-top" alt="Project 2" />
          <div class="card-body">
            <h5 class="card-title">Quiz Game</h5>
            <p class="card-text">An interactive quiz game built with vanilla JavaScript and dynamic scoring.</p>
            <button class="btn btn-warning">View Project</button>
          </div>
        </div>
      </div>

      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="porfolio.png" class="card-img-top" alt="Project 3" />
          <div class="card-body">
            <h5 class="card-title">Portfolio Site</h5>
            <p class="card-text">A personal portfolio website styled with Bootstrap and custom CSS.</p>
            <button class="btn btn-warning">View Project</button>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
