<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Playlist Sorter</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body { background: lavender; }
        h1, h3 { color: darkviolet; }
        .box { background: white; color: darkviolet; }
    </style>
</head>
<body>

    <div class="container py-4">

        <h1 class="mb-1">My Playlist Sorter</h1>
        <p class="text-muted mb-4">Sort song names, sort play counts, and label every play count — all with JavaScript array methods.</p>

        <!-- Song Names card -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Song Names</h3>
                <button class="btn btn-primary" onclick="sortAZ()">Sort A to Z</button>
                <button class="btn btn-primary" onclick="sortZA()">Sort Z to A</button>
                <div id="nameResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <!-- Play Counts card -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Play Counts</h3>
                <button class="btn btn-primary" onclick="sortLeast()">Least Played First</button>
                <button class="btn btn-primary" onclick="sortMost()">Most Played First</button>
                <div id="countResult" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <!-- Label Every Play Count card -->
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Label Every Play Count</h3>
                <button class="btn btn-primary" onclick="addLabel()">Add Plays Label</button>
                <div id="labelResult" class="box p-3 mt-3 rounded">Press the button above!</div>
            </div>
        </div>

    </div>

    <script>
        let songs = ['Zoom', 'Bounce', 'Glow', 'Rush', 'Spark'];
        let plays = [320, 85, 210, 50, 175];

        document.getElementById("nameResult").innerHTML = "Songs: " + songs;
        document.getElementById("countResult").innerHTML = "Plays: " + plays;
        document.getElementById("labelResult").innerHTML = "Press the button above!";

        function sortAZ() {
            songs.sort();
            document.getElementById("nameResult").innerHTML = "Songs: " + songs;
        }

        function sortZA() {
            songs.sort();
            songs.reverse();
            document.getElementById("nameResult").innerHTML = "Songs: " + songs;
        }

        function sortLeast() {
            plays.sort(function(a, b) { return a - b; });
            document.getElementById("countResult").innerHTML = "Plays: " + plays;
        }

        function sortMost() {
            plays.sort(function(a, b) { return b - a; });
            document.getElementById("countResult").innerHTML = "Plays: " + plays;
        }

        function addLabel() {
            let labeled = plays.map(function(c) { return c + ' plays'; });
            document.getElementById("labelResult").innerHTML = "Plays: " + labeled;
        }
    </script>

</body>
</html>
