<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

  <!-- My CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
    rel="stylesheet" />

  <title>Portfolio</title>
</head>

<body>

  <div id="social-media" class="container-fluid">
    <div class="container text-white py-5">

      <h4 class="text-warning">Social Media</h4>
      <h1 class="m-heading">Let's be friends</h1>

      <div class="row pt-5">

        <div class="col-3 media_link btn">
          <div class="row">
            <div class="col-8">
              <h3>LinkedIn</h3>
            </div>
            <div class="col-4 text-right">
              <i class="fab fa-linkedin"></i>
            </div>
          </div>
        </div>

        <div class="col-3 media_link btn">
          <div class="row">
            <div class="col-8">
              <h3>Youtube</h3>
            </div>
            <div class="col-4 text-right">
              <i class="fab fa-youtube"></i>
            </div>
          </div>
        </div>

        <div class="col-3 media_link bg-warning btn">
          <div class="row">
            <div class="col-8">
              <h3 class="text-dark">Email</h3>
            </div>
            <div class="col-4 text-right">
              <i class="fas fa-envelope text-dark"></i>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
